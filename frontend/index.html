<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telco Churn Predictor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>Telco Churn Prediction</h1>
        <p>Enter customer information to predict whether they are likely to churn.</p>
      </header>

      <main class="layout">
        <section class="card form-card">
          <form id="customerForm">
            <div class="grid">
              <label>
                Gender
                <select name="gender">
                  <option value="Female">Female</option>
                  <option value="Male">Male</option>
                </select>
              </label>

              <label>
                Senior Citizen
                <select name="SeniorCitizen">
                  <option value="0">No</option>
                  <option value="1">Yes</option>
                </select>
              </label>

              <label>
                Partner
                <select name="Partner">
                  <option value="No">No</option>
                  <option value="Yes">Yes</option>
                </select>
              </label>

              <label>
                Dependents
                <select name="Dependents">
                  <option value="No">No</option>
                  <option value="Yes">Yes</option>
                </select>
              </label>

              <label>
                Tenure
                <input type="number" name="tenure" value="12" min="0" max="100" required />
              </label>

              <label>
                Phone Service
                <select name="PhoneService">
                  <option value="No">No</option>
                  <option value="Yes">Yes</option>
                </select>
              </label>

              <label>
                Multiple Lines
                <select name="MultipleLines">
                  <option value="No">No</option>
                  <option value="No phone service">No phone service</option>
                  <option value="Yes">Yes</option>
                </select>
              </label>

              <label>
                Internet Service
                <select name="InternetService">
                  <option value="DSL">DSL</option>
                  <option value="Fiber optic">Fiber optic</option>
                  <option value="No">No</option>
                </select>
              </label>

              <label>
                Online Security
                <select name="OnlineSecurity">
                  <option value="No">No</option>
                  <option value="No internet service">No internet service</option>
                  <option value="Yes">Yes</option>
                </select>
              </label>

              <label>
                Online Backup
                <select name="OnlineBackup">
                  <option value="No">No</option>
                  <option value="No internet service">No internet service</option>
                  <option value="Yes">Yes</option>
                </select>
              </label>

              <label>
                Device Protection
                <select name="DeviceProtection">
                  <option value="No">No</option>
                  <option value="No internet service">No internet service</option>
                  <option value="Yes">Yes</option>
                </select>
              </label>

              <label>
                Tech Support
                <select name="TechSupport">
                  <option value="No">No</option>
                  <option value="No internet service">No internet service</option>
                  <option value="Yes">Yes</option>
                </select>
              </label>

              <label>
                Streaming TV
                <select name="StreamingTV">
                  <option value="No">No</option>
                  <option value="No internet service">No internet service</option>
                  <option value="Yes">Yes</option>
                </select>
              </label>

              <label>
                Streaming Movies
                <select name="StreamingMovies">
                  <option value="No">No</option>
                  <option value="No internet service">No internet service</option>
                  <option value="Yes">Yes</option>
                </select>
              </label>

              <label>
                Contract
                <select name="Contract">
                  <option value="Month-to-month">Month-to-month</option>
                  <option value="One year">One year</option>
                  <option value="Two year">Two year</option>
                </select>
              </label>

              <label>
                Paperless Billing
                <select name="PaperlessBilling">
                  <option value="No">No</option>
                  <option value="Yes">Yes</option>
                </select>
              </label>

              <label>
                Payment Method
                <select name="PaymentMethod">
                  <option value="Electronic check">Electronic check</option>
                  <option value="Mailed check">Mailed check</option>
                  <option value="Bank transfer (automatic)">Bank transfer (automatic)</option>
                  <option value="Credit card (automatic)">Credit card (automatic)</option>
                </select>
              </label>

              <label>
                Monthly Charges
                <input type="number" name="MonthlyCharges" value="75" step="0.01" min="0" required />
              </label>

              <label>
                Total Charges
                <input type="number" name="TotalCharges" value="750" step="0.01" min="0" required />
              </label>
            </div>

            <button type="submit">Predict</button>
          </form>
        </section>

        <aside class="card result-card">
          <h2>Prediction Result</h2>
          <div id="resultBox" class="result-box neutral">
            <p class="result-text">Waiting for prediction</p>
          </div>
          <div class="history-box">
            <h3>Recent records</h3>
            <ul id="historyList"></ul>
          </div>
        </aside>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
